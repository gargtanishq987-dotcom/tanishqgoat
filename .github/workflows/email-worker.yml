name: Email Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger email worker
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET "https://client-one-delta-89.vercel.app/api/cron" \
            -H "x-worker-secret: ${{ secrets.WORKER_SECRET }}")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status: $body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Worker returned error status $status"
            exit 1
          fi
